site_name: Devil x Slime Wiki
site_description: The wiki for Devil x Slime, the High School DxD addon for Tensura Reincarnated.
site_url: https://malwikpl.github.io/devil-x-slime-wiki/
repo_url: https://github.com/Malwikpl/devil-x-slime-wiki
repo_name: Edit this wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/images/logo-wings.png
  favicon: assets/images/logo-wings.png
  font: false
  icon:
    repo: material/pencil
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first Sacred Gear: getting-started/first-gear.md
      - The mode wheel: getting-started/mode-wheel.md
      - Dragon flight: getting-started/flight.md
  - Boosted Gear:
      - boosted-gear/index.md
      - Forms and mastery: boosted-gear/forms-and-mastery.md
      - Boost, Transfer and Dragon Shot: boosted-gear/modes.md
      - Balance Breaker: boosted-gear/balance-breaker.md
      - Promotion's armour forms: boosted-gear/promotion-forms.md
      - Ddraig and his Bargain: boosted-gear/ddraig.md
      - Juggernaut Drive: boosted-gear/juggernaut-drive.md
      - Penetrate: boosted-gear/penetrate.md
      - Ascalon: boosted-gear/ascalon.md
      - Divide (Albion's power): boosted-gear/divide.md
  - Divine Dividing:
      - divine-dividing/index.md
      - Balance Breaker (white Scale Mail): divine-dividing/balance-breaker.md
      - Juggernaut Drive (the white dragon): divine-dividing/juggernaut-drive.md
  - Twilight Healing: twilight-healing/index.md
  - Sword Birth:
      - sword-birth/index.md
      - Sword of Betrayer: sword-birth/sword-of-betrayer.md
  - Forbidden Balor View: balor-view/index.md
  - Absorption Line: absorption-line/index.md
  - Salvation Rose: salvation-rose/index.md
  - Durandal and the Holy Factor: durandal/index.md
  - Excalibur's fragments: excalibur/index.md
  - Races:
      - Devils: races/devil.md
      - House powers: races/houses.md
      - The Peerage: races/peerage.md
      - Rias Gremory: races/rias.md
      - Asia Argento: races/asia.md
      - Angels and Fallen Angels: races/angels.md
      - Light weapons: races/light-weapons.md
      - Holy Lightning: races/holy-lightning.md
      - Brave Saints: races/brave-saints.md
      - Michael: races/michael.md
      - Nekomata and Nekoshou: races/nekomata.md
      - Valkyries: races/valkyrie.md
      - Kitsune and the Nine-Tailed Fox: races/kitsune.md
  - World:
      - The White Dragon Emperor: world/white-dragon-emperor.md
      - Fenrir: world/fenrir.md
      - Stray Devils: world/stray-devils.md
      - The Castle Town of Gremory: world/castle-town.md
      - Structures: world/structures.md
  - Lore mode: lore-mode.md
  - Reference:
      - Commands: reference/commands.md
      - Configuration: reference/configuration.md
      - Multiplayer and servers: reference/multiplayer.md
      - Looks, cutscenes and effects: reference/looks.md
      - Status effects: reference/status-effects.md
      - Compatibility and known limits: reference/compatibility.md
  - FAQ: faq.md
  - Roadmap: roadmap.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
